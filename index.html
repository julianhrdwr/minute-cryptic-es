<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#b9dcff">

<title>Minute Cryptic ES</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap');

:root{
  --blue:#b9dcff;
  --pink:#f4b8dc;
  --pink-dark:#dc76b2;
  --yellow:#ffe58f;
  --green:#b9edc9;
  --red:#ffb8b8;
  --white:#fffdf9;
  --black:#171717;
  --gray:#6e6e6e;
  --light:#f3f3f0;

  --border:3px solid var(--black);
  --shadow:5px 5px 0 var(--black);
  --radius:22px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,
body{
  margin:0;
  min-height:100%;
}

body{
  background:var(--blue);
  color:var(--black);
  font-family:"DM Sans",Arial,sans-serif;
}

button{
  font:inherit;
  color:inherit;
  cursor:pointer;
  -webkit-appearance:none;
}

.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  margin:auto;
  padding:18px 16px 40px;
}

/* =========================
   HEADER
========================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:24px;
}

.logo{
  font-family:"Playfair Display",Georgia,serif;
  font-style:italic;
  font-weight:700;
  font-size:30px;
  letter-spacing:-1.5px;
}

.logo small{
  display:block;
  font-family:"DM Mono",monospace;
  font-size:10px;
  font-style:normal;
  letter-spacing:0;
  margin-top:-4px;
  opacity:.7;
}

.icon-btn{
  width:44px;
  height:44px;
  border:var(--border);
  background:var(--white);
  border-radius:50%;
  font-weight:800;
  box-shadow:3px 3px 0 var(--black);
}

.icon-btn:active{
  transform:translate(2px,2px);
  box-shadow:1px 1px 0 var(--black);
}

/* =========================
   SCREENS
========================= */

.screen{
  display:none;
}

.screen.active{
  display:block;
}

/* =========================
   HOME
========================= */

.hero{
  margin-top:25px;
  margin-bottom:28px;
}

.hero h1{
  font-size:48px;
  line-height:.95;
  letter-spacing:-3px;
  margin:0 0 18px;
}

.hero h1 span{
  display:inline-block;
  background:var(--pink);
  padding:2px 8px 5px;
  border:var(--border);
  border-radius:12px;
  box-shadow:4px 4px 0 var(--black);
}

.hero p{
  font-size:18px;
  line-height:1.4;
  max-width:480px;
  margin:20px 0;
}

.home-buttons{
  display:grid;
  gap:12px;
}

.primary{
  width:100%;
  border:var(--border);
  border-radius:17px;
  background:var(--black);
  color:white;
  padding:16px 20px;
  font-size:18px;
  font-weight:800;
  box-shadow:5px 5px 0 rgba(0,0,0,.18);
}

.primary:active{
  transform:translate(3px,3px);
  box-shadow:2px 2px 0 rgba(0,0,0,.18);
}

.secondary{
  width:100%;
  border:var(--border);
  border-radius:17px;
  background:var(--white);
  padding:15px 20px;
  font-size:17px;
  font-weight:800;
  box-shadow:var(--shadow);
}

.secondary:active{
  transform:translate(3px,3px);
  box-shadow:2px 2px 0 var(--black);
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:30px;
}

.stat{
  background:var(--white);
  border:var(--border);
  border-radius:18px;
  padding:14px 8px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:25px;
}

.stat span{
  display:block;
  font-size:10px;
  text-transform:uppercase;
  font-family:"DM Mono",monospace;
}

/* =========================
   DAILY STATUS
========================= */

.daily-done{
  background:var(--green);
  border:var(--border);
  border-radius:20px;
  padding:18px;
  margin-top:25px;
  box-shadow:4px 4px 0 var(--black);
}

.daily-done h3{
  margin:0 0 6px;
  font-size:20px;
}

.daily-done p{
  margin:0;
  line-height:1.4;
  font-size:14px;
}

/* =========================
   GAME
========================= */

.top-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.back{
  border:0;
  background:none;
  padding:4px 0;
  font-weight:800;
  font-size:15px;
}

.daily{
  font-family:"DM Mono",monospace;
  font-size:11px;
  font-weight:500;
}

.game-card{
  background:var(--white);
  border:var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
  overflow:hidden;
}

.puzzle-meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.badge{
  background:var(--yellow);
  border:2px solid var(--black);
  border-radius:99px;
  padding:5px 9px;
  font-size:11px;
  font-weight:800;
}

.timer{
  font-family:"DM Mono",monospace;
  font-size:13px;
  white-space:nowrap;
}

.clue{
  font-family:Georgia,serif;
  font-size:28px;
  line-height:1.25;
  margin:12px 0 12px;
}

.enumeration{
  font-family:"DM Mono",monospace;
  font-size:12px;
  color:var(--gray);
}

/* Highlighted clue parts */

.clue .definition{
  background:var(--pink);
  border-radius:5px;
  padding:1px 3px;
}

.clue .indicator{
  background:var(--yellow);
  border-radius:5px;
  padding:1px 3px;
}

.clue .fodder{
  background:var(--green);
  border-radius:5px;
  padding:1px 3px;
}

/* =========================
   ANSWER
========================= */

.answer-area{
  margin:28px 0 18px;
}

.answer-boxes{
  display:flex;
  justify-content:center;
  align-items:center;
  gap:7px;
  flex-wrap:wrap;
  width:100%;
}

.letter-box{
  width:42px;
  height:48px;
  border:3px solid var(--black);
  border-radius:9px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:800;
  text-transform:lowercase;
}

.letter-box.filled{
  background:var(--yellow);
}

.letter-box.revealed{
  background:var(--pink);
}

.answer-message{
  text-align:center;
  font-weight:800;
  min-height:25px;
  margin-top:12px;
}

.answer-message.error{
  color:#a90026;
}

.answer-message.success{
  color:#19733b;
}

/* =========================
   HINT MENU
========================= */

.hint-menu{
  display:none;
  margin-top:12px;
  padding:12px;
  background:var(--yellow);
  border:2px solid var(--black);
  border-radius:15px;
  gap:8px;
}

.hint-menu.show{
  display:grid;
}

.hint-option{
  width:100%;
  border:2px solid var(--black);
  background:white;
  border-radius:11px;
  padding:11px 12px;
  text-align:left;
  font-size:13px;
  font-weight:800;
}

.hint-option:active{
  transform:translateY(2px);
}

.hint-option.used{
  opacity:.45;
}

.hint-option strong{
  display:block;
}

.hint-option small{
  display:block;
  margin-top:3px;
  font-weight:500;
  color:var(--gray);
}

.hint-panel{
  margin-top:10px;
}

.hint{
  border:2px solid var(--black);
  border-radius:14px;
  background:white;
  padding:12px;
  font-size:14px;
  line-height:1.4;
}

.hint-title{
  font-family:"DM Mono",monospace;
  font-size:10px;
  text-transform:uppercase;
  font-weight:800;
  margin-bottom:5px;
}

/* =========================
   ACTIONS
========================= */

.game-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:18px;
}

.action{
  border:2px solid var(--black);
  background:var(--light);
  border-radius:13px;
  padding:12px 8px;
  font-size:13px;
  font-weight:800;
}

.action:active{
  transform:translateY(2px);
}

/* =========================
   KEYBOARD
========================= */

.keyboard{
  margin-top:20px;
  width:100%;
  display:grid;
  gap:6px;
}

.key-row{
  width:100%;
  display:flex;
  justify-content:center;
  gap:5px;
}

.key{
  flex:1 1 0;
  min-width:0;
  height:43px;
  border:2px solid var(--black);
  border-radius:8px;
  background:white;
  font-weight:800;
  font-size:14px;
  padding:0;
}

.key.wide{
  flex:2 1 0;
}

.key:active{
  transform:translateY(2px);
}

/* =========================
   RESULT
========================= */

.result{
  display:none;
  margin-top:18px;
  padding:17px;
  border:var(--border);
  border-radius:17px;
  background:var(--green);
}

.result.show{
  display:block;
}

.result h3{
  margin:0 0 7px;
}

.result p{
  margin:7px 0;
  line-height:1.45;
  font-size:14px;
}

.result .secondary{
  margin-top:12px;
}

/* =========================
   LEARN
========================= */

.learn-header{
  margin-bottom:25px;
}

.learn-header h2{
  font-size:37px;
  letter-spacing:-2px;
  margin:0 0 8px;
}

.learn-header p{
  margin:0;
  line-height:1.4;
}

.course{
  margin-bottom:30px;
}

.course-title{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:10px;
  margin-bottom:5px;
}

.course-title h3{
  margin:0;
  font-size:23px;
}

.course-title span{
  font-family:"DM Mono",monospace;
  font-size:10px;
  opacity:.65;
}

.course-desc{
  margin:0 0 13px;
  font-size:14px;
  line-height:1.4;
}

.lesson-card{
  background:var(--white);
  border:var(--border);
  border-radius:18px;
  padding:15px;
  margin-bottom:11px;
  box-shadow:4px 4px 0 var(--black);
  display:flex;
  align-items:center;
  gap:12px;
}

.lesson-icon{
  width:45px;
  height:45px;
  flex:0 0 45px;
  border:2px solid var(--black);
  border-radius:12px;
  background:var(--pink);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:19px;
  font-weight:800;
}

.lesson-info{
  flex:1;
  min-width:0;
}

.lesson-info strong{
  display:block;
  font-size:15px;
}

.lesson-info small{
  font-family:"DM Mono",monospace;
  font-size:10px;
  color:var(--gray);
}

.lesson-open{
  border:2px solid var(--black);
  background:var(--yellow);
  border-radius:10px;
  padding:8px 9px;
  font-size:11px;
  font-weight:800;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:50;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(620px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--white);
  border:var(--border);
  border-radius:25px 25px 15px 15px;
  box-shadow:7px 7px 0 var(--black);
  padding:22px;
}

.modal-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.lesson-progress{
  display:flex;
  gap:5px;
}

.progress-dot{
  width:24px;
  height:5px;
  border-radius:10px;
  background:#ddd;
}

.progress-dot.active{
  background:var(--black);
}

.close{
  border:2px solid var(--black);
  background:white;
  width:38px;
  height:38px;
  border-radius:50%;
  font-weight:900;
}

.slide-number{
  font-family:"DM Mono",monospace;
  font-size:10px;
  margin-bottom:12px;
}

.modal-card h2{
  font-size:31px;
  letter-spacing:-1px;
  margin:0 0 13px;
}

.modal-card p{
  line-height:1.5;
  font-size:16px;
}

.big-example{
  background:var(--blue);
  border:var(--border);
  border-radius:16px;
  padding:17px;
  margin:17px 0;
}

.example-clue{
  font-family:Georgia,serif;
  font-size:20px;
  line-height:1.35;
  margin-bottom:10px;
}

.example-answer{
  font-family:"DM Mono",monospace;
  font-weight:800;
  font-size:20px;
}

.tip{
  background:var(--yellow);
  border:2px solid var(--black);
  border-radius:14px;
  padding:13px;
  font-size:14px;
  line-height:1.4;
  margin:15px 0;
}

.indicator-list{
  display:grid;
  gap:8px;
  margin:14px 0;
}

.indicator-item{
  background:#f1f1ef;
  border:2px solid var(--black);
  border-radius:11px;
  padding:10px;
  font-size:13px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.modal-actions button{
  flex:1;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translate(-50%,120px);
  background:var(--black);
  color:white;
  padding:12px 17px;
  border-radius:99px;
  font-size:13px;
  font-weight:700;
  z-index:100;
  transition:.25s;
  white-space:nowrap;
}

.toast.show{
  transform:translate(-50%,0);
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px){

  .app{
    padding-left:12px;
    padding-right:12px;
  }

  .game-card{
    padding:17px;
  }

  .clue{
    font-size:25px;
  }

  .key{
    height:40px;
    font-size:13px;
  }

  .letter-box{
    width:39px;
    height:45px;
  }

}

@media(min-width:700px){

  .app{
    padding-top:28px;
  }

  .hero h1{
    font-size:64px;
  }

  .modal{
    align-items:center;
  }

  .modal-card{
    border-radius:25px;
  }

}
</style>
</head>

<body>

<div class="app">

<!-- =========================================================
     HOME
========================================================= -->

<section id="home" class="screen active">

  <header class="header">

    <div class="logo">
      minute cryptic
      <small>español · v0.5</small>
    </div>

    <button class="icon-btn" onclick="openAbout()">?</button>

  </header>

  <div class="hero">

    <h1>
      Una pista.<br>
      Una <span>respuesta.</span>
    </h1>

    <p>
      Aprendé a resolver pistas crípticas,
      una técnica a la vez.
    </p>

    <div id="dailyHome"></div>

    <div class="home-buttons">

      <button
        id="dailyButton"
        class="primary"
        onclick="startDaily()">
        Jugar la pista de hoy →
      </button>

      <button
        class="secondary"
        onclick="showScreen('learn')">
        Aprender cripticismo
      </button>

    </div>

  </div>

  <div class="stats">

    <div class="stat">
      <strong id="statSolved">0</strong>
      <span>resueltas</span>
    </div>

    <div class="stat">
      <strong id="statStreak">0</strong>
      <span>racha</span>
    </div>

    <div class="stat">
      <strong id="statHints">0</strong>
      <span>pistas usadas</span>
    </div>

  </div>

</section>


<!-- =========================================================
     GAME
========================================================= -->

<section id="game" class="screen">

  <div class="top-row">

    <button class="back" onclick="showScreen('home')">
      ← inicio
    </button>

    <span class="daily" id="dailyLabel">
      PISTA DEL DÍA
    </span>

  </div>

  <div class="game-card">

    <div class="puzzle-meta">

      <div class="badges" id="mechanismBadges"></div>

      <div class="timer" id="timer">
        00:00
      </div>

    </div>

    <div class="clue" id="clue"></div>

    <div class="enumeration" id="enumeration"></div>

    <div class="answer-area">

      <div
        class="answer-boxes"
        id="answerBoxes">
      </div>

      <div
        class="answer-message"
        id="answerMessage">
      </div>

    </div>


    <!-- MENÚ DE PISTAS -->

    <div
      class="hint-menu"
      id="hintMenu">

      <button
        class="hint-option"
        onclick="showSelectedHint('definition')">

        <strong>
          ◎ Mostrar definición
        </strong>

        <small>
          Te señala qué parte define la respuesta.
        </small>

      </button>


      <button
        class="hint-option"
        onclick="showSelectedHint('indicator')">

        <strong>
          ⚡ Mostrar indicador
        </strong>

        <small>
          Te señala la palabra que indica qué hacer.
        </small>

      </button>


      <button
        class="hint-option"
        onclick="showSelectedHint('fodder')">

        <strong>
          ▣ Mostrar fodder
        </strong>

        <small>
          Te muestra las letras que hay que trabajar.
        </small>

      </button>

    </div>


    <div
      class="hint-panel"
      id="hintPanel">
    </div>


    <div class="game-actions">

      <button
        class="action"
        onclick="useHint()">
        💡 Pista
      </button>

      <button
        class="action"
        onclick="revealLetter()">
        ✦ Revelar letra
      </button>

      <button
        class="action"
        onclick="checkAnswer()">
        ✓ Comprobar
      </button>

      <button
        class="action"
        onclick="shareResult()">
        ↗ Compartir
      </button>

    </div>


    <div
      class="keyboard"
      id="keyboard">
    </div>


    <div
      class="result"
      id="result">

      <h3 id="resultTitle"></h3>

      <p id="resultExplanation"></p>

      <button
        class="secondary"
        onclick="showScreen('home')">
        Volver al inicio
      </button>

    </div>

  </div>

</section>


<!-- =========================================================
     LEARN
========================================================= -->

<section id="learn" class="screen">

  <div class="top-row">

    <button
      class="back"
      onclick="showScreen('home')">
      ← inicio
    </button>

  </div>

  <div class="learn-header">

    <h2>
      Aprendé a resolver.
    </h2>

    <p>
      No hace falta adivinar.
      Cada pista tiene una pequeña máquina
      escondida adentro.
    </p>

  </div>

  <div id="courses"></div>

</section>

</div>


<!-- =========================================================
     LESSON MODAL
========================================================= -->

<div
  class="modal"
  id="lessonModal">

  <div class="modal-card">

    <div class="modal-top">

      <div
        class="lesson-progress"
        id="lessonProgress">
      </div>

      <button
        class="close"
        onclick="closeLesson()">
        ×
      </button>

    </div>

    <div id="lessonContent"></div>

    <div class="modal-actions">

      <button
        class="secondary"
        id="lessonBack"
        onclick="previousSlide()">
        ← Atrás
      </button>

      <button
        class="primary"
        id="lessonNext"
        onclick="nextSlide()">
        Siguiente →
      </button>

    </div>

  </div>

</div>


<div
  class="toast"
  id="toast">
</div>


<script>

/* ============================================================
   PISTAS
============================================================ */

const PUZZLES = [

  {
    id:"amor",
    clue:"Cariño, en desorden de roma. (4)",
    answer:"AMOR",

    mechanisms:["anagram"],

    definition:"Cariño",
    fodder:"roma",
    indicator:"desorden",

    hint:"Las letras de una palabra tienen que cambiar de orden.",

    explanation:
      "ROMA reordenado forma AMOR. «Cariño» es la definición y «desorden» indica el anagrama."
  },


  {
    id:"mora",
    clue:"Fruta escondida en morado. (4)",
    answer:"MORA",

    mechanisms:["hidden"],

    definition:"Fruta",
    fodder:"mora",
    indicator:"escondida",

    hint:"La respuesta ya está dentro de otra palabra.",

    explanation:
      "MORA aparece seguida dentro de MORADO. «Escondida» indica que hay que buscar la respuesta dentro del texto."
  },


  {
    id:"lobo",
    clue:"Animal: lobos sin su s final. (4)",
    answer:"LOBO",

    mechanisms:["deletion"],

    definition:"Animal",
    fodder:"lobos",
    indicator:"sin su s final",

    hint:"Tomá LOBOS y eliminá su última letra.",

    explanation:
      "LOBOS sin su S final deja LOBO."
  },


  {
    id:"roma",
    clue:"Ciudad italiana, amor al revés. (4)",
    answer:"ROMA",

    mechanisms:["reversal"],

    definition:"Ciudad italiana",
    fodder:"amor",
    indicator:"al revés",

  );

/* ============================================================
   FECHA
============================================================ */

function getDateKey(){

  const d = new Date();

  return [
    d.getFullYear(),
    String(d.getMonth()+1).padStart(2,"0"),
    String(d.getDate()).padStart(2,"0")
  ].join("-");

}


/* ============================================================
   PISTA DEL DÍA
============================================================ */

function getDailyPuzzle(){

  const key = getDateKey();

  let hash = 0;

  for(let i=0;i<key.length;i++){

    hash =
      ((hash << 5) - hash) +
      key.charCodeAt(i);

    hash |= 0;

  }

  const index =
    Math.abs(hash) % PUZZLES.length;

  return PUZZLES[index];

}


/* ============================================================
   ¿YA RESOLVIÓ LA DEL DÍA?
============================================================ */

function hasSolvedToday(){

  return state.dailySolved === getDateKey();

}

    .forEach(screen=>{
      screen.classList.remove("active");
    });

  document

  });

============================================================ */

function startDaily(){

  if(hasSolvedToday()){

    showDailyCompleted();

    return;

  }

  startPuzzle(
    getDailyPuzzle(),
    "PISTA DEL DÍA"
  );

}


/* ============================================================
   JUGAR PISTA
============================================================ */

function startPuzzle(puzzle,label){

  currentPuzzle = puzzle;

  currentAnswer =
    new Array(puzzle.answer.length)
      .fill("");

  revealed =
    new Array(puzzle.answer.length)
      .fill(false);

  usedHints = {
    definition:false,
    indicator:false,
    fodder:false
  };

  timerSeconds = 0;
  gameFinished = false;

  clearInterval(timerInterval);

  timerInterval =
    setInterval(()=>{

      if(!gameFinished){

        timerSeconds++;

        renderTimer();

      }

    },1000);

  document.getElementById("dailyLabel").textContent =
    label;

  renderPuzzle();

  showScreen("game");

}


/* ============================================================
   RENDER PISTA
============================================================ */

function renderPuzzle(){

  const puzzle = currentPuzzle;

  document.getElementById("mechanismBadges").innerHTML =
    puzzle.mechanisms
      .map(m =>
        `<span class="badge">
          ${MECHANISM_NAMES[m] || m}
        </span>`
      )
      .join("");

  document.getElementById("clue").innerHTML =
    highlightClue(puzzle);

  document.getElementById("enumeration").textContent =
    `${puzzle.answer.length} letras`;

  renderAnswerBoxes();

  renderKeyboard();

  renderHintButtons();

  renderTimer();

  document.getElementById("answerMessage").textContent =
    "";

  document.getElementById("answerMessage").className =
    "answer-message";

  document.getElementById("hintPanel").innerHTML =
    "";

  document.getElementById("hintMenu")
    .classList.remove("show");

  document.getElementById("result")
    .classList.remove("show");

}


/* ============================================================
   RESALTAR PARTES DE LA PISTA
============================================================ */

function highlightClue(puzzle){

  let text =
    escapeHTML(puzzle.clue);

  if(
    usedHints.definition &&
    puzzle.definition
  ){

    text =
      replaceSafe(
        text,
        puzzle.definition,
        `<span class="definition">
          ${escapeHTML(puzzle.definition)}
        </span>`
      );

  }

  if(
    usedHints.indicator &&
    puzzle.indicator
  ){

    text =
      replaceSafe(
        text,
        puzzle.indicator,
        `<span class="indicator">
          ${escapeHTML(puzzle.indicator)}
        </span>`
      );

  }

  if(
    usedHints.fodder &&
    puzzle.fodder
  ){

    text =
      replaceSafe(
        text,
        puzzle.fodder,
        `<span class="fodder">
          ${escapeHTML(puzzle.fodder)}
        </span>`
      );

  }

  return text;

}


function replaceSafe(text,original,replacement){

  const regex =
    new RegExp(
      escapeRegex(original),
      "i"
    );

  return text.replace(
    regex,
    replacement
  );

}


/* ============================================================
   CASILLEROS
============================================================ */

function renderAnswerBoxes(){

  const container =
    document.getElementById("answerBoxes");

  container.innerHTML = "";

  currentAnswer.forEach((letter,index)=>{

    const box =
      document.createElement("div");

    box.className =
      "letter-box";

    if(letter){

      box.textContent =
        letter.toLowerCase();

      box.classList.add("filled");

    }

    if(revealed[index]){

      box.classList.add("revealed");

    }

    container.appendChild(box);

  });

}


/* ============================================================
   TECLADO
============================================================ */

function renderKeyboard(){

  const rows = [
    ["Q","W","E","R","T","Y","U","I","O","P"],
    ["A","S","D","F","G","H","J","K","L","Ñ"],
    ["⌫","Z","X","C","V","B","N","M","↵"]
  ];

  const keyboard =
    document.getElementById("keyboard");

  keyboard.innerHTML = "";

  rows.forEach((row,rowIndex)=>{

    const rowElement =
      document.createElement("div");

    rowElement.className =
      "key-row";

    row.forEach(letter=>{

      const button =
        document.createElement("button");

      button.className = "key";

      if(
        letter==="⌫" ||
        letter==="↵"
      ){

        button.classList.add("wide");

      }

      button.textContent =
        letter;

      if(letter==="⌫"){

        button.onclick =
          deleteLetter;

      }else if(letter==="↵"){

        button.onclick =
          checkAnswer;

      }else{

        button.onclick =
          ()=>{
            enterLetter(letter);
          };

      }

      rowElement.appendChild(button);

    });

    keyboard.appendChild(rowElement);

  });

}


/* ============================================================
   ESCRIBIR
============================================================ */

function enterLetter(letter){

  if(gameFinished) return;

  const index =
    currentAnswer.findIndex(
      (value,i)=>
        !value && !revealed[i]
    );

  if(index===-1) return;

  currentAnswer[index] =
    letter.toUpperCase();

  renderAnswerBoxes();

}


/* ============================================================
   BORRAR
============================================================ */

function deleteLetter(){

  if(gameFinished) return;

  for(
    let i=currentAnswer.length-1;
    i>=0;
    i--
  ){

    if(
      currentAnswer[i] &&
      !revealed[i]
    ){

      currentAnswer[i]="";

      renderAnswerBoxes();

      return;

    }

  }

}


/* ============================================================
   COMPROBAR
============================================================ */

function checkAnswer(){

  if(gameFinished) return;

  const guess =
    currentAnswer
      .join("")
      .toUpperCase();

  if(
    guess.length <
    currentPuzzle.answer.length
  ){

    showToast("Todavía faltan letras.");

    return;

  }

  if(
    guess ===
    currentPuzzle.answer
  ){

    finishPuzzle();

  }else{

    const message =
      document.getElementById("answerMessage");

    message.textContent =
      "No coincide. Probá otra vez.";

    message.className =
      "answer-message error";

  }

}


/* ============================================================
   TERMINAR
============================================================ */

function finishPuzzle(){

  gameFinished = true;

  clearInterval(timerInterval);

  state.solved++;

  state.dailySolved =
    getDateKey();

  updateStreak();

  saveState();

  const message =
    document.getElementById("answerMessage");

  message.textContent =
    "¡Correcto! ✓";

  message.className =
    "answer-message success";

  document.getElementById("resultTitle").textContent =
    "¡Muy bien!";

  document.getElementById("resultExplanation").innerHTML =

    `<strong>
      ${escapeHTML(currentPuzzle.answer)}
    </strong>

    <br><br>

    ${escapeHTML(currentPuzzle.explanation)}`;

  document
    .getElementById("result")
    .classList.add("show");

  updateStats();

  showToast("Pista resuelta ✓");

}

  const today =
    getDateKey();

  if(state.lastSolved === today){
    return;
  }

  const yesterdayDate =
    new Date();

  yesterdayDate.setDate(
    yesterdayDate.getDate()-1
  );

  const yesterday = [

    yesterdayDate.getFullYear(),

    String(
      yesterdayDate.getMonth()+1
    ).padStart(2,"0"),

    String(
      yesterdayDate.getDate()
    ).padStart(2,"0")

  ].join("-");


  if(
    state.lastSolved === yesterday
  ){

    state.streak++;

  }else{

    state.streak=1;

  }

  state.lastSolved =
    today;

}


/* ============================================================
   PISTAS
============================================================ */

function useHint(){

  if(gameFinished) return;

  const menu =
    document.getElementById("hintMenu");

  menu.classList.toggle("show");

}


/* ============================================================
   SELECCIONAR PISTA
============================================================ */

function showSelectedHint(type){

  if(gameFinished) return;

  const puzzle =
    currentPuzzle;

  let content = "";

  if(type==="definition"){

    if(!puzzle.definition){

      showToast(
        "Esta pista no tiene una definición separada."
      );

      return;

    }

    usedHints.definition = true;

    content = `
      <div class="hint">
        <div class="hint-title">
          Definición
        </div>

        <strong>
          ${escapeHTML(puzzle.definition)}
        </strong>
      </div>
    `;

  }


  if(type==="indicator"){

    if(!puzzle.indicator){

      showToast(
        "Esta pista no usa un indicador."
      );

      return;

    }

    usedHints.indicator = true;

    content = `
      <div class="hint">
        <div class="hint-title">
          Indicador
        </div>

        <strong>
          ${escapeHTML(puzzle.indicator)}
        </strong>
      </div>
    `;

  }


  if(type==="fodder"){

    if(!puzzle.fodder){

      showToast(
        "Esta pista no tiene fodder."
      );

      return;

    }

    usedHints.fodder = true;

    content = `
      <div class="hint">
        <div class="hint-title">
          Fodder
        </div>

        <strong>
          ${escapeHTML(puzzle.fodder)}
        </strong>
      </div>
    `;

  }


  document.getElementById("hintPanel").innerHTML =
    content;

  document.getElementById("hintMenu")
    .classList.remove("show");

  state.hints++;

  saveState();

  updateStats();

  renderHintButtons();

  document.getElementById("clue").innerHTML =
    highlightClue(currentPuzzle);

}


/* ============================================================
   BOTONES DE PISTA
============================================================ */

function renderHintButtons(){

  const buttons =
    document.querySelectorAll(
      ".hint-option"
    );

  if(buttons.length<3) return;

  buttons[0].classList.toggle(
    "used",
    usedHints.definition
  );

  buttons[1].classList.toggle(
    "used",
    usedHints.indicator
  );

  buttons[2].classList.toggle(
    "used",
    usedHints.fodder
  );

}


/* ============================================================
   REVELAR LETRA
============================================================ */

function revealLetter(){

  if(gameFinished) return;

  const answer =
    currentPuzzle.answer;

  let index=-1;


  /*
    Busca la primera letra que
    todavía NO fue revelada.
  */

  for(
    let i=0;
    i<answer.length;
    i++
  ){

    if(!revealed[i]){

      index=i;

      break;

    }

  }


  if(index===-1){

    showToast(
      "Ya revelaste todas las letras."
    );

    return;

  }


  currentAnswer[index] =
    answer[index];

  revealed[index] =
    true;

  renderAnswerBoxes();

  state.hints++;

  saveState();

  updateStats();

}


/* ============================================================
   TIMER
============================================================ */

function renderTimer(){

  const minutes =
    Math.floor(timerSeconds/60)
      .toString()
      .padStart(2,"0");

  const seconds =
    (timerSeconds%60)
      .toString()
      .padStart(2,"0");

  document.getElementById("timer").textContent =
    `${minutes}:${seconds}`;

}


/* ============================================================
   CURSOS
============================================================ */

function renderCourses(){

  const container =
    document.getElementById("courses");

  container.innerHTML="";


  COURSES.forEach(course=>{

    const section =
      document.createElement("div");

    section.className =
      "course";

    section.innerHTML = `

      <div class="course-title">

        <h3>
          ${course.number}: ${course.title}
        </h3>

        <span>
          ${course.lessons.length} técnicas
        </span>

      </div>

      <p class="course-desc">
        ${course.description}
      </p>

    `;


    course.lessons.forEach(lesson=>{

      const key =
        `${course.id}_${lesson.id}`;

      const progress =
        state.courseProgress[key] || 0;


      const card =
        document.createElement("div");

      card.className =
        "lesson-card";


      card.innerHTML = `

        <div class="lesson-icon">
          ${lesson.icon}
        </div>

        <div class="lesson-info">

          <strong>
            ${lesson.title}
          </strong>

          <small>
            ${Math.min(progress,3)}/3 completados
          </small>

        </div>

        <button class="lesson-open">
          Aprender
        </button>

      `;


      card
        .querySelector(".lesson-open")
        .onclick = ()=>{
          openLesson(course,lesson);
        };


      section.appendChild(card);

    });


    container.appendChild(section);

  });

}


/* ============================================================
   ABRIR LECCIÓN
============================================================ */

function openLesson(course,lesson){

  currentLesson = {
    course,
    lesson
  };

  currentSlide=0;

  renderLesson();

  document
    .getElementById("lessonModal")
    .classList.add("show");

}


/* ============================================================
   CERRAR LECCIÓN
============================================================ */

function closeLesson(){

  document
    .getElementById("lessonModal")
    .classList.remove("show");

}


/* ============================================================
   RENDER LECCIÓN
============================================================ */

function renderLesson(){

  const lesson =
    currentLesson.lesson;

  const slide =
    lesson.slides[currentSlide];

  const total =
    lesson.slides.length;


  const progress =
    document.getElementById(
      "lessonProgress"
    );

  progress.innerHTML="";


  for(
    let i=0;
    i<total;
    i++
  ){

    const dot =
      document.createElement("div");

    dot.className =
      "progress-dot" +
      (
        i===currentSlide
          ? " active"
          : ""
      );

    progress.appendChild(dot);

  }


  let html = `

    <div class="slide-number">
      ${currentSlide+1} / ${total}
    </div>

    <h2>
      ${slide.title}
    </h2>

    <p>
      ${slide.text}
    </p>

  `;


  if(slide.example){

    html += `

      <div class="big-example">

        <div class="example-clue">
          ${escapeHTML(
            slide.example.clue
          )}
        </div>

        <div class="example-answer">
          → ${escapeHTML(
            slide.example.answer
          )}
        </div>

      </div>

    `;

  }


  if(slide.list){

    html += `

      <div class="indicator-list">

        ${slide.list.map(item=>

          `<div class="indicator-item">
            ${escapeHTML(item)}
          </div>`

        ).join("")}

      </div>

    `;

  }


  if(slide.tip){

    html += `

      <div class="tip">
        💡 ${escapeHTML(slide.tip)}
      </div>

    `;

  }


  document.getElementById(
    "lessonContent"
  ).innerHTML = html;


  document.getElementById(
    "lessonBack"
  ).style.visibility =
    currentSlide===0
      ? "hidden"
      : "visible";


  document.getElementById(
    "lessonNext"
  ).textContent =
    currentSlide===total-1
      ? "Terminar ✓"
      : "Siguiente →";

}


/* ============================================================
   SIGUIENTE
============================================================ */

function nextSlide(){

  const lesson =
    currentLesson.lesson;


  if(
    currentSlide <
    lesson.slides.length-1
  ){

    currentSlide++;

    renderLesson();

  }else{

    completeLesson();

    closeLesson();

    showToast(
      "Lección completada ✓"
    );

  }

}


/* ============================================================
   ATRÁS
============================================================ */

function previousSlide(){

  if(currentSlide>0){

    currentSlide--;

    renderLesson();

  }

}


/* ============================================================
   COMPLETAR LECCIÓN
============================================================ */

function completeLesson(){

  const course =
    currentLesson.course;

  const lesson =
    currentLesson.lesson;

  if(!course.id) return;

  const key =
    `${course.id}_${lesson.id}`;

  state.courseProgress[key]=3;

  saveState();

  renderCourses();

}

   ABOUT
============================================================ */

/* ============================================================
   COMPARTIR
============================================================ */

async function shareResult(){

  if(!currentPuzzle) return;


  let text =

`🧩 Minute Cryptic ES

${gameFinished
  ? "✓ Resolví la pista:"
  : "Estoy intentando resolver:"}

"${currentPuzzle.clue}"

${gameFinished
  ? "Respuesta: " + currentPuzzle.answer
  : ""}`;


  if(navigator.share){

    try{

      await navigator.share({

        title:"Minute Cryptic ES",

        text:text

      });

    }catch(e){}

    return;

  }


  try{

    await navigator.clipboard.writeText(
      text
    );

    showToast(
      "Resultado copiado."
    );

  }catch(e){

    showToast(
      "No se pudo copiar."
    );

  }

}


/* ============================================================
   TECLADO FÍSICO
============================================================ */

document.addEventListener(
  "keydown",
  event=>{

    if(
      !document
        .getElementById("game")
        .classList
        .contains("active")
    ){

      return;

    }


    if(
      /^[a-zA-ZñÑ]$/.test(
        event.key
      )
    ){

      enterLetter(event.key);

    }


    if(
      event.key==="Backspace"
    ){

      deleteLetter();

    }


    if(
      event.key==="Enter"
    ){

      checkAnswer();

    }

  }
);


/* ============================================================
   ESCAPE PARA CERRAR MODAL
============================================================ */

document.addEventListener(
  "keydown",
  event=>{

    if(
      event.key==="Escape"
    ){

      closeLesson();

    }

  }
);


/* ============================================================
   UTILIDADES
============================================================ */

function escapeHTML(str){

  return String(str)

    .replaceAll(
      "&",
      "&amp;"
    )

    .replaceAll(
      "<",
      "&lt;"
    )

    .replaceAll(
      ">",
      "&gt;"
    )

    .replaceAll(
      '"',
      "&quot;"
    )

    .replaceAll(
      "'",
      "&#039;"
    );

}


function escapeRegex(str){

  return String(str)
    .replace(
      /[.*+?^${}()|[\]\\]/g,
      "\\$&"
    );

}


let toastTimer;

function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );

  toast.textContent =
    message;

  toast.classList.add("show");

  clearTimeout(
    toastTimer
  );

  toastTimer =
    setTimeout(()=>{

      toast.classList.remove(
        "show"
      );

    },2200);

}


/* ============================================================
   INICIO
============================================================ */

renderHome();
renderCourses();
updateStats();

</script>
