<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#b9dcff">

<title>Minute Cryptic ES</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,700&display=swap');

:root{
  --blue:#b9dcff;
  --blue-dark:#8fc4f5;
  --pink:#f4b8dc;
  --pink-dark:#e68cc0;
  --yellow:#ffe58f;
  --green:#b9edc9;
  --red:#ffb6b6;
  --white:#fffdf9;
  --black:#171717;
  --gray:#6e6e6e;
  --light:#f4f4f1;

  --border:3px solid var(--black);
  --shadow:5px 5px 0 var(--black);
  --radius:22px;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  min-height:100%;
}

body{
  background:var(--blue);
  color:var(--black);
  font-family:"DM Sans",Arial,sans-serif;
}

button{
  font:inherit;
  color:inherit;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:620px;
  min-height:100vh;
  margin:auto;
  padding:18px 16px 40px;
}

/* =========================
   HEADER
========================= */

.header{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:22px;
}

.logo{
  font-family:"Playfair Display",Georgia,serif;
  font-style:italic;
  font-weight:700;
  font-size:30px;
  letter-spacing:-1.5px;
}

.logo small{
  font-family:"DM Mono",monospace;
  font-size:11px;
  font-style:normal;
  letter-spacing:0;
  display:block;
  margin-top:-5px;
  opacity:.7;
}

.icon-btn{
  width:44px;
  height:44px;
  border:var(--border);
  background:var(--white);
  border-radius:50%;
  font-weight:800;
  box-shadow:3px 3px 0 var(--black);
}

.icon-btn:active{
  transform:translate(2px,2px);
  box-shadow:1px 1px 0 var(--black);
}

/* =========================
   SCREENS
========================= */

.screen{
  display:none;
}

.screen.active{
  display:block;
}

/* =========================
   HOME
========================= */

.hero{
  margin-top:25px;
  margin-bottom:28px;
}

.hero h1{
  font-size:48px;
  line-height:.95;
  letter-spacing:-3px;
  margin:0 0 14px;
  max-width:500px;
}

.hero h1 span{
  background:var(--pink);
  padding:0 8px;
  border:var(--border);
  border-radius:12px;
  box-shadow:4px 4px 0 var(--black);
}

.hero p{
  font-size:18px;
  line-height:1.4;
  max-width:480px;
  margin:20px 0;
}

.primary{
  width:100%;
  border:var(--border);
  border-radius:17px;
  background:var(--black);
  color:white;
  padding:16px 20px;
  font-size:18px;
  font-weight:800;
  box-shadow:5px 5px 0 rgba(0,0,0,.18);
}

.primary:active{
  transform:translate(3px,3px);
  box-shadow:2px 2px 0 rgba(0,0,0,.18);
}

.secondary{
  width:100%;
  border:var(--border);
  border-radius:17px;
  background:var(--white);
  padding:15px 20px;
  font-size:17px;
  font-weight:800;
  box-shadow:var(--shadow);
}

.secondary:active{
  transform:translate(3px,3px);
  box-shadow:2px 2px 0 var(--black);
}

.home-buttons{
  display:grid;
  gap:12px;
}

.stats{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:10px;
  margin-top:30px;
}

.stat{
  background:var(--white);
  border:var(--border);
  border-radius:18px;
  padding:14px 10px;
  text-align:center;
}

.stat strong{
  display:block;
  font-size:25px;
}

.stat span{
  font-size:11px;
  text-transform:uppercase;
  font-family:"DM Mono",monospace;
}

/* =========================
   GAME
========================= */

.top-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px;
}

.back{
  border:0;
  background:none;
  padding:4px 0;
  font-weight:800;
  font-size:15px;
}

.daily{
  font-family:"DM Mono",monospace;
  font-size:12px;
}

.game-card{
  background:var(--white);
  border:var(--border);
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  padding:20px;
}

.puzzle-meta{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:18px;
}

.badges{
  display:flex;
  flex-wrap:wrap;
  gap:6px;
}

.badge{
  background:var(--yellow);
  border:2px solid var(--black);
  border-radius:99px;
  padding:5px 9px;
  font-size:11px;
  font-weight:800;
}

.timer{
  font-family:"DM Mono",monospace;
  font-size:13px;
  white-space:nowrap;
}

.clue{
  font-family:Georgia,serif;
  font-size:27px;
  line-height:1.25;
  margin:12px 0 24px;
}

.clue .definition{
  border-bottom:4px solid var(--pink-dark);
}

.clue .indicator{
  background:var(--yellow);
  border-radius:5px;
  padding:1px 3px;
}

.clue .fodder{
  background:var(--green);
  border-radius:5px;
  padding:1px 3px;
}

.enumeration{
  font-family:"DM Mono",monospace;
  font-size:12px;
  color:var(--gray);
}

/* ANSWER */

.answer-area{
  margin:20px 0;
}

.answer-boxes{
  display:flex;
  justify-content:center;
  gap:7px;
  flex-wrap:wrap;
}

.letter-box{
  width:42px;
  height:48px;
  border:3px solid var(--black);
  border-radius:9px;
  background:white;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:25px;
  font-weight:800;
  text-transform:lowercase;
}

.letter-box.filled{
  background:var(--yellow);
}

.letter-box.revealed{
  background:var(--pink);
}

.answer-message{
  text-align:center;
  font-weight:800;
  min-height:24px;
  margin-top:12px;
}

/* HINTS */

.hint-panel{
  margin-top:15px;
}

.hint{
  border:2px solid var(--black);
  border-radius:14px;
  background:#fff;
  padding:12px;
  margin-top:8px;
  font-size:14px;
  line-height:1.4;
}

.hint-title{
  font-family:"DM Mono",monospace;
  font-size:10px;
  text-transform:uppercase;
  font-weight:800;
  margin-bottom:4px;
}

.game-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:18px;
}

.action{
  border:2px solid var(--black);
  background:var(--light);
  border-radius:13px;
  padding:11px 8px;
  font-size:13px;
  font-weight:800;
}

.action:disabled{
  opacity:.45;
}

/* KEYBOARD */

.keyboard{
  margin-top:20px;
  display:grid;
  gap:6px;
}

.key-row{
  display:flex;
  justify-content:center;
  gap:5px;
}

.key{
  width:31px;
  height:43px;
  border:2px solid var(--black);
  border-radius:7px;
  background:white;
  font-weight:800;
  font-size:14px;
  padding:0;
}

.key:active{
  transform:translateY(2px);
}

.key.wide{
  width:65px;
}

.result{
  display:none;
  margin-top:18px;
  padding:17px;
  border:var(--border);
  border-radius:17px;
  background:var(--green);
}

.result.show{
  display:block;
}

.result h3{
  margin:0 0 7px;
}

.result p{
  margin:7px 0;
  line-height:1.45;
  font-size:14px;
}

/* =========================
   LEARN
========================= */

.learn-header{
  margin-bottom:25px;
}

.learn-header h2{
  font-size:37px;
  letter-spacing:-2px;
  margin:0 0 8px;
}

.learn-header p{
  margin:0;
  line-height:1.4;
}

.course{
  margin-bottom:28px;
}

.course-title{
  display:flex;
  align-items:end;
  justify-content:space-between;
  margin-bottom:12px;
}

.course-title h3{
  margin:0;
  font-size:23px;
}

.course-title span{
  font-family:"DM Mono",monospace;
  font-size:10px;
  opacity:.65;
}

.course-desc{
  margin:0 0 12px;
  font-size:14px;
  line-height:1.4;
}

.lesson-card{
  background:var(--white);
  border:var(--border);
  border-radius:18px;
  padding:15px;
  margin-bottom:10px;
  box-shadow:4px 4px 0 var(--black);
  display:flex;
  align-items:center;
  gap:13px;
}

.lesson-icon{
  width:45px;
  height:45px;
  flex:0 0 45px;
  border:2px solid var(--black);
  border-radius:12px;
  background:var(--pink);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:21px;
}

.lesson-info{
  flex:1;
}

.lesson-info strong{
  display:block;
  font-size:16px;
}

.lesson-info small{
  font-family:"DM Mono",monospace;
  font-size:10px;
  color:var(--gray);
}

.lesson-open{
  border:2px solid var(--black);
  background:var(--yellow);
  border-radius:10px;
  padding:8px 10px;
  font-size:12px;
  font-weight:800;
}

.locked{
  opacity:.55;
  box-shadow:none;
}

/* =========================
   MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.45);
  z-index:50;
  display:none;
  align-items:flex-end;
  justify-content:center;
  padding:12px;
}

.modal.show{
  display:flex;
}

.modal-card{
  width:min(620px,100%);
  max-height:92vh;
  overflow:auto;
  background:var(--white);
  border:var(--border);
  border-radius:25px 25px 15px 15px;
  box-shadow:7px 7px 0 var(--black);
  padding:22px;
}

.modal-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  margin-bottom:15px;
}

.close{
  border:2px solid var(--black);
  background:white;
  width:38px;
  height:38px;
  border-radius:50%;
  font-weight:900;
}

.lesson-progress{
  display:flex;
  gap:5px;
}

.progress-dot{
  width:24px;
  height:5px;
  border-radius:10px;
  background:#ddd;
}

.progress-dot.active{
  background:var(--black);
}

.slide-number{
  font-family:"DM Mono",monospace;
  font-size:10px;
  margin-bottom:12px;
}

.modal-card h2{
  font-size:31px;
  letter-spacing:-1px;
  margin:0 0 13px;
}

.modal-card p{
  line-height:1.5;
  font-size:16px;
}

.big-example{
  background:var(--blue);
  border:var(--border);
  border-radius:16px;
  padding:17px;
  margin:17px 0;
}

.big-example .example-clue{
  font-family:Georgia,serif;
  font-size:20px;
  margin-bottom:9px;
}

.big-example .example-answer{
  font-family:"DM Mono",monospace;
  font-weight:800;
  font-size:20px;
}

.tip{
  background:var(--yellow);
  border:2px solid var(--black);
  border-radius:14px;
  padding:13px;
  font-size:14px;
  line-height:1.4;
  margin:15px 0;
}

.indicator-list{
  display:grid;
  gap:8px;
  margin:14px 0;
}

.indicator-item{
  background:#f1f1ef;
  border:2px solid var(--black);
  border-radius:11px;
  padding:10px;
  font-size:13px;
}

.modal-actions{
  display:flex;
  gap:8px;
  margin-top:20px;
}

.modal-actions button{
  flex:1;
}

/* =========================
   TOAST
========================= */

.toast{
  position:fixed;
  left:50%;
  bottom:22px;
  transform:translate(-50%,120px);
  background:var(--black);
  color:white;
  padding:12px 17px;
  border-radius:99px;
  font-size:13px;
  font-weight:700;
  z-index:100;
  transition:.25s;
}

.toast.show{
  transform:translate(-50%,0);
}

/* =========================
   DESKTOP
========================= */

@media(min-width:700px){
  .app{
    padding-top:28px;
  }

  .hero h1{
    font-size:64px;
  }

  .modal{
    align-items:center;
  }

  .modal-card{
    border-radius:25px;
  }
}
</style>
</head>

<body>

<div class="app">

  <!-- ================= HOME ================= -->

  <section id="home" class="screen active">

    <header class="header">
      <div class="logo">
        minute cryptic
        <small>español · v0.4</small>
      </div>

      <button class="icon-btn" onclick="openAbout()">?</button>
    </header>

    <div class="hero">
      <h1>
        Una pista.<br>
        Una <span>respuesta.</span>
      </h1>

      <p>
        Aprendé a resolver pistas crípticas,
        una técnica a la vez.
      </p>

      <div class="home-buttons">
        <button class="primary" onclick="startDaily()">
          Jugar la pista de hoy →
        </button>

        <button class="secondary" onclick="showScreen('learn')">
          Aprender cripticismo
        </button>
      </div>
    </div>

    <div class="stats">
      <div class="stat">
        <strong id="statSolved">0</strong>
        <span>resueltas</span>
      </div>

      <div class="stat">
        <strong id="statStreak">0</strong>
        <span>racha</span>
      </div>

      <div class="stat">
        <strong id="statHints">0</strong>
        <span>pistas</span>
      </div>
    </div>

  </section>


  <!-- ================= GAME ================= -->

  <section id="game" class="screen">

    <div class="top-row">
      <button class="back" onclick="showScreen('home')">
        ← inicio
      </button>

      <span class="daily" id="dailyLabel">
        PISTA DEL DÍA
      </span>
    </div>

    <div class="game-card">

      <div class="puzzle-meta">

        <div class="badges" id="mechanismBadges"></div>

        <div class="timer" id="timer">
          00:00
        </div>

      </div>

      <div class="clue" id="clue"></div>

      <div class="enumeration" id="enumeration"></div>

      <div class="answer-area">
        <div class="answer-boxes" id="answerBoxes"></div>

        <div class="answer-message" id="answerMessage"></div>
      </div>

      <div class="hint-panel" id="hintPanel"></div>

      <div class="game-actions">

        <button class="action" onclick="useHint()">
          💡 Pista
        </button>

        <button class="action" onclick="revealLetter()">
          ✦ Revelar letra
        </button>

        <button class="action" onclick="checkAnswer()">
          ✓ Comprobar
        </button>

        <button class="action" onclick="shareResult()">
          ↗ Compartir
        </button>

      </div>

      <div class="keyboard" id="keyboard"></div>

      <div class="result" id="result">
        <h3 id="resultTitle"></h3>
        <p id="resultExplanation"></p>
        <button class="secondary" onclick="startRandomPuzzle()">
          Otra pista →
        </button>
      </div>

    </div>

  </section>


  <!-- ================= LEARN ================= -->

  <section id="learn" class="screen">

    <div class="top-row">
      <button class="back" onclick="showScreen('home')">
        ← inicio
      </button>
    </div>

    <div class="learn-header">
      <h2>Aprendé a resolver.</h2>
      <p>
        No hace falta adivinar. Cada pista tiene
        una pequeña máquina escondida adentro.
      </p>
    </div>

    <div id="courses"></div>

  </section>

</div>


<!-- ================= LESSON MODAL ================= -->

<div class="modal" id="lessonModal">

  <div class="modal-card">

    <div class="modal-top">

      <div class="lesson-progress" id="lessonProgress"></div>

      <button class="close" onclick="closeLesson()">×</button>

    </div>

    <div id="lessonContent"></div>

    <div class="modal-actions">

      <button class="secondary" id="lessonBack" onclick="previousSlide()">
        ← Atrás
      </button>

      <button class="primary" id="lessonNext" onclick="nextSlide()">
        Siguiente →
      </button>

    </div>

  </div>

</div>


<div class="toast" id="toast"></div>


<script>

/* ============================================================
   DATA
============================================================ */

const PUZZLES = [

  {
    id:"amor",
    clue:"Cariño, en desorden de ROMA. (4)",
    answer:"AMOR",
    mechanisms:["anagram"],
    definition:"Cariño",
    fodder:"ROMA",
    indicator:"desorden",
    hint:"Buscá una palabra que indique que las letras de ROMA deben mezclarse.",
    explanation:"ROMA reordenado forma AMOR. «Cariño» es la definición y «desorden» indica el anagrama."
  },

  {
    id:"mora",
    clue:"Fruta escondida en MORADO. (4)",
    answer:"MORA",
    mechanisms:["hidden"],
    definition:"Fruta",
    fodder:"MORA",
    indicator:"escondida",
    hint:"La respuesta está literalmente dentro de otra palabra.",
    explanation:"MORA aparece seguida dentro de MORADO. «Escondida» indica que hay que buscar la respuesta dentro del texto."
  },

  {
    id:"lobo",
    clue:"Animal: LOBOS sin su S final. (4)",
    answer:"LOBO",
    mechanisms:["deletion"],
    definition:"Animal",
    fodder:"LOBOS",
    indicator:"sin su S final",
    hint:"Tomá LOBOS y quitale una letra.",
    explanation:"LOBOS sin su última S deja LOBO. La definición es «Animal»."
  },

  {
    id:"roma",
    clue:"Ciudad italiana, AMOR al revés. (4)",
    answer:"ROMA",
    mechanisms:["reversal"],
    definition:"Ciudad italiana",
    fodder:"AMOR",
    indicator:"al revés",
    hint:"Probá leer AMOR desde el final hacia el principio.",
    explanation:"AMOR leído al revés es ROMA. «Ciudad italiana» es la definición y «al revés» es el indicador."
  },

  {
    id:"bello",
    clue:"Bonito, según suena «vello». (5)",
    answer:"BELLO",
    mechanisms:["homophone"],
    definition:"Bonito",
    fodder:"VELLO",
    indicator:"según suena",
    hint:"La respuesta suena igual que otra palabra.",
    explanation:"BELLO y VELLO tienen el mismo sonido en la pronunciación habitual del español. «Bonito» da la definición."
  },

  {
    id:"copa",
    clue:"Vaso / parte alta de un árbol. (4)",
    answer:"COPA",
    mechanisms:["double"],
    definition:"Vaso / parte alta de un árbol",
    fodder:"",
    indicator:"",
    hint:"La misma palabra tiene dos significados.",
    explanation:"COPA puede ser un vaso para beber y también la parte superior de un árbol."
  },

  {
    id:"aro",
    clue:"Círculo: principios de Aves Roban Ocas. (3)",
    answer:"ARO",
    mechanisms:["initials"],
    definition:"Círculo",
    fodder:"Aves Roban Ocas",
    indicator:"principios",
    hint:"Mirá las primeras letras de las palabras centrales.",
    explanation:"Las iniciales de Aves, Roban y Ocas forman ARO."
  },

  {
    id:"ave",
    clue:"Ave que aparece en CLAVE. (3)",
    answer:"AVE",
    mechanisms:["hidden"],
    definition:"Ave",
    fodder:"AVE",
    indicator:"aparece en",
    hint:"No necesitás modificar ninguna letra.",
    explanation:"AVE está escondida dentro de CLAVE."
  }

];


/* ============================================================
   MECHANISM NAMES
============================================================ */

const MECHANISM_NAMES = {

  anagram:"Anagrama",
  hidden:"Oculta",
  deletion:"Eliminación",
  reversal:"Reversión",
  homophone:"Homófona",
  double:"Doble definición",
  initials:"Iniciales",
  synonym:"Sinónimo",
  symbol:"Símbolo",
  container:"Contenedor",
  translation:"Traducción",
  homoglyph:"Homoglifo",
  lit:"&lit",
  rebus:"Rebus"

};


/* ============================================================
   COURSES
============================================================ */

const COURSES = [

  {
    id:"letterplay",
    number:"Curso 1",
    title:"letterplay",
    description:"Jugá directamente con las letras que aparecen en la pista.",
    lessons:[

      {
        id:"reversal",
        icon:"↔",
        title:"Reversiones",
        slides:[
          {
            title:"Las letras pueden darse vuelta.",
            text:"Una reversión toma un grupo de letras y lo lee en sentido contrario. Es una operación sencilla, pero aparece muchísimo combinada con otras técnicas.",
            example:{
              clue:"Ciudad italiana, AMOR al revés. (4)",
              answer:"ROMA"
            }
          },
          {
            title:"Buscá el indicador.",
            text:"Ciertas palabras avisan que hay que invertir las letras. No necesitás memorizar una lista infinita: primero reconocé la idea de movimiento hacia atrás.",
            list:[
              "Literal: al revés, invertido, de vuelta",
              "Figurativo: girando, dado vuelta, regresando",
              "En pistas verticales: palabras que sugieren subir"
            ]
          },
          {
            title:"Encontrá las tres piezas.",
            text:"En una pista de reversión normalmente querés encontrar definición, indicador y letras que deben invertirse.",
            example:{
              clue:"Ciudad italiana, AMOR al revés. (4)",
              answer:"ROMA"
            },
            tip:"Importante: invertir letras que ya fueron mezcladas por un anagrama no aporta información, por eso estas dos operaciones no suelen combinarse."
          }
        ]
      },

      {
        id:"anagram",
        icon:"✣",
        title:"Anagramas",
        slides:[
