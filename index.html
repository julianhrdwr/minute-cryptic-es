<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#acd3f8">
<title>Minute Cryptic Español</title>

<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Libre+Baskerville:ital,wght@0,700;1,700&display=swap');

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --blue:#acd3f8;
  --pink:#e9c4f2;
  --yellow:#fff08a;
  --black:#111;
  --white:#fff;
  --gray:#666;
}

body{
  margin:0;
  background:var(--blue);
  color:var(--black);
  font-family:"DM Sans",Arial,sans-serif;
}

button,input{
  font:inherit;
}

.app{
  width:100%;
  max-width:600px;
  margin:auto;
  min-height:100vh;
  overflow:hidden;
}

/* HEADER */

.header{
  height:86px;
  padding:20px 24px;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.signin{
  background:var(--pink);
  font-family:"Libre Baskerville",serif;
  font-style:italic;
  font-weight:bold;
  font-size:20px;
  padding:2px 5px;
}

.logo{
  width:43px;
  height:43px;
  background:var(--pink);
  border:3px solid var(--black);
  border-radius:2px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Libre Baskerville",serif;
  font-size:34px;
  font-style:italic;
  font-weight:bold;
}

/* HERO */

.hero{
  padding:32px 26px 20px;
}

.hero h1{
  font-size:43px;
  line-height:1.05;
  margin:0 0 18px;
  font-weight:800;
  letter-spacing:-1.8px;
}

.hero p{
  font-size:18px;
  margin:0;
}

/* DAILY CARD */

.daily{
  margin:20px 25px 24px;
  background:white;
  border:4px solid var(--black);
  border-radius:28px;
  box-shadow:0 8px 0 var(--black);
  padding:27px 22px 24px;
  text-align:center;
}

.daily-title{
  font-size:12px;
  font-weight:800;
  letter-spacing:1.5px;
  text-transform:uppercase;
  margin-bottom:20px;
}

.clue{
  font-size:25px;
  line-height:1.45;
  margin-bottom:23px;
}

.clue .definition{
  background:var(--yellow);
}

.play{
  display:block;
  width:150px;
  margin:auto;
  padding:12px 20px;
  border:3px solid var(--black);
  border-radius:30px;
  background:var(--pink);
  box-shadow:0 5px 0 var(--black);
  font-family:"Libre Baskerville",serif;
  font-style:italic;
  font-weight:bold;
  font-size:20px;
  cursor:pointer;
}

.play:active{
  transform:translateY(4px);
  box-shadow:0 1px 0 var(--black);
}

.date{
  margin-top:23px;
  font-size:13px;
  color:#444;
}

/* DAYS */

.days{
  padding:5px 25px 35px;
  display:flex;
  gap:12px;
  overflow-x:auto;
}

.days::-webkit-scrollbar{
  display:none;
}

.day{
  min-width:91px;
  height:130px;
  background:white;
  border-radius:20px;
  padding:10px;
  text-align:center;
  flex-shrink:0;
}

.day.today{
  border:3px solid var(--black);
}

.day-icon{
  width:47px;
  height:63px;
  border:3px solid var(--black);
  border-radius:7px;
  margin:0 auto 7px;
  background:white;
  position:relative;
}

.day-icon:before{
  content:"";
  position:absolute;
  left:7px;
  right:7px;
  top:9px;
  height:9px;
  border:2px solid var(--black);
  background:var(--pink);
}

.day-icon:after{
  content:"";
  position:absolute;
  left:10px;
  right:10px;
  bottom:10px;
  height:15px;
  background:var(--blue);
}

.day-name{
  font-size:13px;
  font-weight:800;
}

/* PLAY SCREEN */

#game{
  display:none;
  padding-bottom:40px;
}

.game-header{
  display:flex;
  align-items:center;
  gap:15px;
  padding:17px 25px;
}

.back{
  background:none;
  border:0;
  font-size:38px;
  line-height:1;
  padding:0;
  cursor:pointer;
}

.game-date{
  font-size:16px;
  font-weight:800;
}

.game-author{
  font-size:12px;
  margin-top:3px;
}

/* GAME CLUE */

.game-clue{
  background:white;
  margin:8px 25px 22px;
  border-radius:12px;
  padding:20px 18px;
  font-size:24px;
  line-height:1.45;
  text-align:center;
}

.mark{
  background:var(--pink);
}

/* LETTERS */

.answer-box{
  display:flex;
  justify-content:center;
  gap:4px;
  margin:8px 20px 30px;
  flex-wrap:wrap;
}

.letter{
  width:55px;
  height:58px;
  border:4px solid var(--black);
  border-radius:7px;
  background:var(--pink);
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:"Libre Baskerville",serif;
  font-size:30px;
  font-style:italic;
  font-weight:bold;
}

.letter.empty{
  background:white;
}

/* KEYBOARD */

.keyboard{
  padding:0 18px;
}

.keyrow{
  display:flex;
  justify-content:center;
  gap:5px;
  margin-bottom:6px;
}

.key{
  min-width:30px;
  height:46px;
  border:2px solid var(--black);
  border-radius:6px;
  background:white;
  font-size:16px;
  font-weight:700;
  padding:0 7px;
}

.key:active{
  transform:scale(.94);
}

.key.big{
  min-width:58px;
}

/* CONTROLS */

.controls{
  padding:15px 25px 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.control{
  padding:14px 8px;
  border:3px solid var(--black);
  border-radius:15px;
  background:white;
  font-weight:800;
  cursor:pointer;
}

.control.hint{
  background:var(--yellow);
}

.timer{
  text-align:center;
  font-size:17px;
  font-weight:800;
  margin:20px;
}

/* RESULT */

.result{
  display:none;
  margin:20px 25px;
  background:white;
  border:4px solid var(--black);
  border-radius:25px;
  box-shadow:0 7px 0 var(--black);
  padding:27px 20px;
  text-align:center;
}

.party{
  font-size:48px;
}

.result h2{
  font-family:"Libre Baskerville",serif;
  font-style:italic;
  font-size:30px;
  margin:12px 0;
}

.result-answer{
  font-family:"Libre Baskerville",serif;
  font-size:36px;
  font-style:italic;
  margin:12px 0 18px;
}

.mechanism{
  text-align:left;
  background:#f4f4f4;
  border-radius:14px;
  padding:16px;
  font-size:14px;
  line-height:1.55;
}

.share{
  margin-top:16px;
  background:var(--pink);
  border:3px solid var(--black);
  border-radius:18px;
  padding:14px;
  width:100%;
  font-weight:800;
}

/* STATS */

.stats{
  background:white;
  padding:28px 25px;
}

.stats h2{
  margin:0 0 16px;
  font-size:21px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:9px;
}

.stat{
  background:#f5f5f5;
  border-radius:15px;
  padding:14px 10px;
}

.stat strong{
  display:block;
  font-size:22px;
}

.stat small{
  color:var(--gray);
}

/* FOOTER */

footer{
  background:white;
  padding:20px 25px 35px;
  text-align:center;
  color:#777;
  font-size:12px;
}

@media(max-width:380px){

  .letter{
    width:46px;
    height:52px;
  }

  .key{
    min-width:26px;
    padding:0 5px;
  }

}
</style>
</head>


<body>

<div class="app">

<!-- HOME -->

<div id="home">

<header class="header">
  <div class="signin">sign in</div>
  <div class="logo">m</div>
</header>


<section class="hero">

  <h1>
    Today's<br>
    clue
  </h1>

  <p>
    Una pista. Una respuesta.<br>
    Un minuto.
  </p>

</section>


<section class="daily">

  <div class="daily-title">
    Acertijo del día
  </div>

  <div class="clue" id="homeClue">
  </div>

  <button class="play" onclick="startGame()">
    play
  </button>

  <div class="date" id="homeDate">
  </div>

</section>


<div class="days" id="days">
</div>


<section class="stats">

  <h2>
    Tu progreso
  </h2>

  <div class="stat-grid">

    <div class="stat">
      <strong id="statSolved">0</strong>
      <small>resueltos</small>
    </div>

    <div class="stat">
      <strong id="statBest">—</strong>
      <small>mejor tiempo</small>
    </div>

    <div class="stat">
      <strong id="statStreak">0</strong>
      <small>racha</small>
    </div>

  </div>

</section>


<footer>
  Minute Cryptic Español · v0.3
</footer>

</div>


<!-- GAME -->

<div id="game">

  <header class="game-header">

    <button class="back" onclick="goHome()">
      ←
    </button>

    <div>
      <div class="game-date" id="gameDate"></div>
      <div class="game-author">
        Minute Cryptic Español
      </div>
    </div>

  </header>


  <div class="game-clue" id="gameClue">
  </div>


  <div class="answer-box" id="answerBox">
  </div>


  <div class="keyboard">

    <div class="keyrow">
      <button class="key" onclick="key('q')">q</button>
      <button class="key" onclick="key('w')">w</button>
      <button class="key" onclick="key('e')">e</button>
      <button class="key" onclick="key('r')">r</button>
      <button class="key" onclick="key('t')">t</button>
      <button class="key" onclick="key('y')">y</button>
      <button class="key" onclick="key('u')">u</button>
      <button class="key" onclick="key('i')">i</button>
      <button class="key" onclick="key('o')">o</button>
      <button class="key" onclick="key('p')">p</button>
    </div>

    <div class="keyrow">
      <button class="key" onclick="key('a')">a</button>
      <button class="key" onclick="key('s')">s</button>
      <button class="key" onclick="key('d')">d</button>
      <button class="key" onclick="key('f')">f</button>
      <button class="key" onclick="key('g')">g</button>
      <button class="key" onclick="key('h')">h</button>
      <button class="key" onclick="key('j')">j</button>
      <button class="key" onclick="key('k')">k</button>
      <button class="key" onclick="key('l')">l</button>
      <button class="key" onclick="key('ñ')">ñ</button>
    </div>

    <div class="keyrow">
      <button class="key big" onclick="backspace()">⌫</button>
      <button class="key" onclick="key('z')">z</button>
      <button class="key" onclick="key('x')">x</button>
      <button class="key" onclick="key('c')">c</button>
      <button class="key" onclick="key('v')">v</button>
      <button class="key" onclick="key('b')">b</button>
      <button class="key" onclick="key('n')">n</button>
      <button class="key" onclick="key('m')">m</button>
      <button class="key big" onclick="checkAnswer()">✓</button>
    </div>

  </div>


  <div class="controls">

    <button class="control hint" onclick="showHint()">
      💡 pista
    </button>

    <button class="control" onclick="revealLetter()">
      🔤 letra
    </button>

  </div>


  <div class="timer">
    ⏱️ <span id="timer">1:00</span>
  </div>


  <div class="result" id="result">
  </div>

</div>

</div>


<script>

/*
==================================================
PUZZLES
==================================================
*/

const puzzles = [

{
 answer:"jur y".replace(" ",""),
 clue:"Say, why are you jay-walking around and judging people? (4)",
 mechanism:"Anagrama",
 hint:"La palabra 'why' te da una pista sonora. Pensá en alguien que juzga.",
 explanation:"JURY significa 'jurado'. La pista juega con 'jay-walking' y 'judging': las palabras iniciales apuntan al concepto de JURY."
},

{
 answer:"amor",
 clue:"Cariño desordenado: ROMA revuelta. (4)",
 mechanism:"Anagrama",
 hint:"ROMA puede cambiar de orden.",
 explanation:"ROMA desordenado produce AMOR."
},

{
 answer:"mora",
 clue:"Fruta escondida en 'MORADO'. (4)",
 mechanism:"Palabra escondida",
 hint:"No hay que cambiar ninguna letra.",
 explanation:"MORA aparece consecutivamente dentro de MORADO."
},

{
 answer:"lago",
 clue:"Agua tranquila, regalo sin la R. (4)",
 mechanism:"Eliminación",
 hint:"'regalo' pierde una letra.",
 explanation:"REGALO sin la primera R produce EGALO, así que hay que buscar otra lectura: 'lago' es una definición directa. Este acertijo será reemplazado por uno mejor en la próxima versión."
},

{
 answer:"copa",
 clue:"Vaso elegante o cima de árbol. (4)",
 mechanism:"Doble definición",
 hint:"La respuesta tiene dos significados.",
 explanation:"COPA puede ser un recipiente y también la parte superior de un árbol."
},

{
 answer:"vela",
 clue:"Sirve para navegar y también para iluminar. (4)",
 mechanism:"Doble definición",
 hint:"Una palabra, dos objetos completamente diferentes.",
 explanation:"VELA puede ser la vela de un barco o una vela de cera."
},

{
 answer:"roma",
 clue:"Ciudad italiana hecha un lío con AMOR. (4)",
 mechanism:"Anagrama",
 hint:"Reordená AMOR.",
 explanation:"AMOR reordenado forma ROMA."
},

{
 answer:"lobo",
 clue:"Animal que aparece al quitar una letra de LOBOS. (4)",
 mechanism:"Eliminación",
 hint:"Quitá la última letra.",
 explanation:"LOBOS sin la S final queda LOBO."
},

{
 answer:"ave",
 clue:"Animal volador oculto en CLAVE. (3)",
 mechanism:"Palabra escondida",
 hint:"Está literalmente dentro de otra palabra.",
 explanation:"CLAVE contiene AVE."
},

{
 answer:"mesa",
 clue:"Mueble que aparece al mezclar 'SEMA'. (4)",
 mechanism:"Anagrama",
 hint:"Las cuatro letras están ahí.",
 explanation:"SEMA reordenado forma MESA."
}

];


/*
==================================================
FECHA
==================================================
*/

const now = new Date();

const dateKey =
  now.getFullYear()+"-"+
  String(now.getMonth()+1).padStart(2,"0")+"-"+
  String(now.getDate()).padStart(2,"0");


function dateNumber(){

  let n=0;

  for(let i=0;i<dateKey.length;i++){

    n =
      (n*31 + dateKey.charCodeAt(i))
      >>>0;

  }

  return n;

}


const puzzle =
  puzzles[dateNumber()%puzzles.length];


/*
==================================================
HOME
==================================================
*/

document.getElementById("homeClue").innerHTML =
  puzzle.clue;


document.getElementById("homeDate").textContent =
  formatDate(now);


/*
==================================================
DÍAS
==================================================
*/

function createDays(){

  const container =
    document.getElementById("days");

  const names =
    ["Dom","Lun","Mar","Mié","Jue","Vie","Sáb"];

  for(let i=0;i<5;i++){

    const d =
      new Date(now);

    d.setDate(
      now.getDate()-i
    );

    const div =
      document.createElement("div");

    div.className =
      "day "+(i===0?"today":"");

    div.innerHTML =

      '<div class="day-icon"></div>'+

      '<div class="day-name">'+
      (i===0?"Hoy":names[d.getDay()])+
      '</div>';

    container.appendChild(div);

  }

}

createDays();


/*
==================================================
ESTADO
==================================================
*/

let solved =
  Number(localStorage.getItem("mc_solved")||0);

let best =
  Number(localStorage.getItem("mc_best")||0);

let streak =
  Number(localStorage.getItem("mc_streak")||0);


function updateStats(){

  document.getElementById("statSolved")
    .textContent=solved;

  document.getElementById("statBest")
    .textContent=
    best ? best+"s" : "—";

  document.getElementById("statStreak")
    .textContent=streak;

}

updateStats();


/*
==================================================
JUEGO
==================================================
*/

let typed="";

let timeLeft=60;

let timerInterval=null;

let finished=false;


function startGame(){

  document.getElementById("home")
    .style.display="none";

  document.getElementById("game")
    .style.display="block";

  document.getElementById("gameDate")
    .textContent=formatDate(now);

  document.getElementById("gameClue")
    .textContent=puzzle.clue;

  typed="";

  finished=false;

  timeLeft=60;

  document.getElementById("result")
    .style.display="none";

  renderLetters();

  updateTimer();

  clearInterval(timerInterval);

  timerInterval =
    setInterval(()=>{

      if(finished)return;

      timeLeft--;

      updateTimer();

      if(timeLeft<=0){

        clearInterval(timerInterval);

        timeUp();

      }

    },1000);

}


function goHome(){

  clearInterval(timerInterval);

  document.getElementById("game")
    .style.display="none";

  document.getElementById("home")
    .style.display="block";

}


/*
==================================================
LETRAS
==================================================
*/

function renderLetters(){

  const box =
    document.getElementById("answerBox");

  box.innerHTML="";

  for(let i=0;i<puzzle.answer.length;i++){

    const div =
      document.createElement("div");

    div.className =
      "letter "+
      (typed[i]?"":"empty");

    div.textContent =
      typed[i] || "";

    box.appendChild(div);

  }

}


function key(letter){

  if(finished)return;

  if(typed.length<puzzle.answer.length){

    typed+=letter;

    renderLetters();

  }

}


function backspace(){

  if(finished)return;

  typed =
    typed.slice(0,-1);

  renderLetters();

}


/*
==================================================
COMPROBAR
==================================================
*/

function checkAnswer(){

  if(finished)return;

  if(typed.length!==puzzle.answer.length){

    alert(
      "Todavía faltan letras."
    );

    return;

  }

  if(
    normalize(typed) ===
    normalize(puzzle.answer)
  ){

    win();

  }else{

    const result =
      document.getElementById("result");

    result.style.display="block";

    result.innerHTML =
      "<b>🤔 Casi...</b><br><br>"+
      "Esa no es la respuesta. "+
      "Probá otra vez.";

  }

}


/*
==================================================
PISTA
==================================================
*/

function showHint(){

  if(finished)return;

  const result =
    document.getElementById("result");

  result.style.display="block";

  result.innerHTML =

    "<b>💡 Pista</b><br><br>"+
    puzzle.hint;

}


/*
==================================================
REVELAR LETRA
==================================================
*/

function revealLetter(){

  if(finished)return;

  const pos =
    typed.length;

  if(pos<puzzle.answer.length){

    typed +=
      puzzle.answer[pos];

    renderLetters();

  }

}


/*
==================================================
GANAR
==================================================
*/

function win(){

  finished=true;

  clearInterval(timerInterval);

  const seconds =
    60-timeLeft;

  solved++;

  if(!best || seconds<best){

    best=seconds;

    localStorage.setItem(
      "mc_best",
      best
    );

  }

  streak++;

  localStorage.setItem(
    "mc_solved",
    solved
  );

  localStorage.setItem(
    "mc_streak",
    streak
  );

  updateStats();

  showResult(
    true,
    seconds
  );

}


/*
==================================================
TIEMPO
==================================================
*/

function timeUp(){

  finished=true;

  showResult(
    false,
    60
  );

}


function showResult(won,seconds){

  const result =
    document.getElementById("result");

  result.style.display="block";

  if(won){

    result.innerHTML =

      '<div class="party">🎉</div>'+

      '<h2>you got it!</h2>'+

      '<div class="result-answer">'+
      puzzle.answer+
      '</div>'+

      '<div class="mechanism">'+

      '<b>⏱️ '+
      seconds+
      ' segundos</b><br><br>'+

      '<b>Mecanismo:</b> '+
      puzzle.mechanism+
      '<br><br>'+

      puzzle.explanation+

      '</div>'+

      '<button class="share" onclick="shareResult()">'+
      '↗ compartir'+
      '</button>';

  }else{

    result.innerHTML =

      '<div class="party">⏰</div>'+

      '<h2>se acabó el tiempo</h2>'+

      '<div class="result-answer">'+
      puzzle.answer+
      '</div>'+

      '<div class="mechanism">'+
      '<b>Mecanismo:</b> '+
      puzzle.mechanism+
      '<br><br>'+
      puzzle.explanation+
      '</div>';

  }

}


/*
==================================================
COMPARTIR
==================================================
*/

function shareResult(){

  const text =
    "🧩 Minute Cryptic Español\n"+
    "⏱️ "+(60-timeLeft)+"s\n"+
    "🎉 ¡Resuelto!";

  if(navigator.share){

    navigator.share({
      text:text
    });

  }else{

    navigator.clipboard.writeText(text);

    alert(
      "Resultado copiado."
    );

  }

}


/*
==================================================
UTILIDADES
==================================================
*/

function normalize(text){

  return text
    .normalize("NFD")
    .replace(/[\u0300-\u036f]/g,"")
    .toLowerCase()
    .trim();

}


function formatDate(date){

  const months=[
    "enero","febrero","marzo",
    "abril","mayo","junio",
    "julio","agosto","septiembre",
    "octubre","noviembre","diciembre"
  ];

  return (
    date.getDate()+
    " de "+
    months[date.getMonth()]+
    ", "+
    date.getFullYear()
  );

}

</script>

</body>
</html>
